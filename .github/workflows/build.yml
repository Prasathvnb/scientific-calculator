name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --console=plain 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ScientificCalculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScientificCalculator-apk
          path: ScientificCalculator.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "APK built from ${{ github.sha }}"
          files: ScientificCalculator.apk

      - name: Report build failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build ${{ github.run_number }} failed at ${{ github.sha }}"
            echo
            echo '```'
            if [ -f build.log ]; then
              grep -E "^e: |error:|ERROR|What went wrong|FAILURE|Unresolved|AAPT|Execution failed" -A3 build.log | head -150
              echo "----- tail -----"
              tail -60 build.log
            else
              echo "No build log (failed before build step)"
            fi
            echo '```'
          } > issue.md
          gh issue create --repo "${{ github.repository }}" --title "Build ${{ github.run_number }} failed" --body-file issue.md
